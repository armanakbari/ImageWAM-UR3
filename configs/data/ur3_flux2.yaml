# UR3 dual-arm (EmbodyX/UR3 organize_pi05) — LeRobot v2.1, 3 cameras, 14-dim joint action.
# Adapted from configs/data/robotwin_omnigen2.yaml: only the camera keys change
# (cam_high->camera_top, cam_*_wrist->camera_wrist_*). Action/state are 14-dim absolute
# joint-space, matching RoboTwin, so ConcatLeftAlign + z-score (no delta masking) applies.
#
# First run: keep pretrained_norm_stats=null; a dataset_stats.json is written to the run dir.
# Point pretrained_norm_stats at it (and reuse for eval) on subsequent runs.

train:
  _target_: imagewam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ${oc.env:UR3_DATA_ROOT,./data/ur3/organize_pi05}
  shape_meta:
    images:
      - key: camera_top
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
      - key: camera_wrist_left
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
      - key: camera_wrist_right
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 14
        shape: 14
    state:
      - key: default
        raw_shape: 14
        shape: 14
  num_frames: 17
  global_sample_stride: 1
  action_video_freq_ratio: 1 # 16 action, 16 video frames
  video_size: [288, 256] # final resize video
  camera_key: null
  val_set_proportion: 0.02
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  robotwin_camera_layout: "compact_288x256"
  video_augmentation:
    _target_: imagewam.datasets.lerobot.transforms.image.VideoAugmentation
    p: 0.5
    augment_types: [corrupt_only, color_only, both]
    color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.03}
    gamma: {range: [0.9, 1.1]}
    gaussian_noise: {std: 0.01}
    random_resized_crop: {scale: [0.95, 1.0], ratio: preserve}
    rotate: {degrees: 5.0, fill: mean}
  require_text_cache: false
  endpoint_frames_only: true
  nonidle_filter_path: null
  qwen_text_cache_dir: ???
  qwen_context_len: 128
  processor:
    _target_: imagewam.datasets.lerobot.processors.imagewam_processor.ImageWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    image_obs_steps: 2
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: imagewam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: null
  context_len: 128

val:
  _target_: imagewam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ${oc.env:UR3_DATA_ROOT,./data/ur3/organize_pi05}
  shape_meta:
    images:
      - key: camera_top
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
      - key: camera_wrist_left
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
      - key: camera_wrist_right
        raw_shape: [3, 480, 640]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 14
        shape: 14
    state:
      - key: default
        raw_shape: 14
        shape: 14
  num_frames: 17
  global_sample_stride: 1
  action_video_freq_ratio: 1
  video_size: [288, 256]
  camera_key: null
  val_set_proportion: 0.02
  is_training_set: false
  pretrained_norm_stats: null
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  robotwin_camera_layout: "compact_288x256"
  video_augmentation: null
  require_text_cache: false
  endpoint_frames_only: true
  nonidle_filter_path: null
  qwen_text_cache_dir: ???
  qwen_context_len: 128
  processor:
    _target_: imagewam.datasets.lerobot.processors.imagewam_processor.ImageWAMProcessor
    shape_meta: ${data.val.shape_meta}
    num_obs_steps: ${data.val.num_frames}
    image_obs_steps: 2
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms: null
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: imagewam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: null
  context_len: 128
