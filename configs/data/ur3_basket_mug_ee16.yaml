# EmbodyX dual-arm UR3 — blue_basket + mug, trained jointly. LeRobot v2.1,
# 3 cameras @ 240x320, 14-dim absolute joint action/state [L_arm(6)|L_grip|R_arm(6)|R_grip].
#
# `ee16` means "use the 16D action/state space of the released InternData-A1
# pretrain weight". Like RoboTwin, UR3 stays semantically 14D and is only padded
# with two masked dims (7 and 15); it is not converted into end-effector poses.
# The UR3 14D layout matches RoboTwin's (two 7D arm+gripper groups), so the same
# RobotWin14ToCanonicalEE16 transform applies unchanged.
#
# First run: keep pretrained_norm_stats=null; a dataset_stats.json is written to
# the run dir. Point pretrained_norm_stats at it (and reuse for eval) afterwards.

train:
  _target_: imagewam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ${oc.env:UR3_ROOT,./data/ur3}/blue_basket_lerobot
    - ${oc.env:UR3_ROOT,./data/ur3}/mug_lerobot
  shape_meta:
    images:
      - key: camera_top
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: camera_wrist_left
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: camera_wrist_right
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 14 # before transform
        shape: 16 # after transform
    state:
      - key: default
        raw_shape: 14 # before transform
        shape: 16 # after transform
  num_frames: 17
  global_sample_stride: 1
  action_video_freq_ratio: 1 # 16 action, 16 video frames
  video_size: [288, 256] # final resize video
  camera_key: null
  val_set_proportion: 0.02
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  robotwin_camera_layout: "compact_288x256"
  video_augmentation:
    _target_: imagewam.datasets.lerobot.transforms.image.VideoAugmentation
    p: 0.5
    augment_types: [corrupt_only, color_only, both]
    color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.03}
    gamma: {range: [0.9, 1.1]}
    gaussian_noise: {std: 0.01}
    random_resized_crop: {scale: [0.95, 1.0], ratio: preserve}
    rotate: {degrees: 5.0, fill: mean}
  require_text_cache: false
  endpoint_frames_only: true
  nonidle_filter_path: null
  qwen_text_cache_dir: ???
  qwen_context_len: 128
  processor:
    _target_: imagewam.datasets.lerobot.processors.imagewam_processor.ImageWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    image_obs_steps: 2
    num_output_cameras: 3
    action_output_dim: 16
    proprio_output_dim: 16
    action_state_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.canonical.RobotWin14ToCanonicalEE16
        key: default
    use_stepwise_action_norm: False
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: imagewam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: null
  context_len: 128

val:
  _target_: imagewam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs: ${data.train.dataset_dirs}
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  global_sample_stride: ${data.train.global_sample_stride}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: null
  val_set_proportion: ${data.train.val_set_proportion}
  is_training_set: false
  pretrained_norm_stats: null
  skip_padding_as_possible: ${data.train.skip_padding_as_possible}
  concat_multi_camera: ${data.train.concat_multi_camera}
  robotwin_camera_layout: ${data.train.robotwin_camera_layout}
  video_augmentation: null
  require_text_cache: ${data.train.require_text_cache}
  endpoint_frames_only: ${data.train.endpoint_frames_only}
  nonidle_filter_path: ${data.train.nonidle_filter_path}
  qwen_text_cache_dir: ${data.train.qwen_text_cache_dir}
  qwen_context_len: ${data.train.qwen_context_len}
  processor:
    _target_: imagewam.datasets.lerobot.processors.imagewam_processor.ImageWAMProcessor
    shape_meta: ${data.val.shape_meta}
    num_obs_steps: ${data.val.num_frames}
    image_obs_steps: ${data.train.processor.image_obs_steps}
    num_output_cameras: ${data.train.processor.num_output_cameras}
    action_output_dim: ${data.train.processor.action_output_dim}
    proprio_output_dim: ${data.train.processor.proprio_output_dim}
    action_state_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.canonical.RobotWin14ToCanonicalEE16
        key: default
    use_stepwise_action_norm: ${data.train.processor.use_stepwise_action_norm}
    norm_default_mode: ${data.train.processor.norm_default_mode}
    norm_exception_mode: ${data.train.processor.norm_exception_mode}
    action_state_merger:
      _target_: imagewam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
