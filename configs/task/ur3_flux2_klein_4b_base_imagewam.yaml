# @package _global_
# Fine-tune FLUX.2-klein-4B ImageWAM on the EmbodyX/UR3 (organize_pi05) real dataset.
# Adapted from configs/task/robotwin_flux2_klein_4b_base_imagewam.yaml.
# Base model = pretrained FLUX.2-klein-4B + copy-initialized Action DiT (no policy checkpoint).
#
# 78 episodes / ~118k frames is small, so epochs are raised vs. the 5-epoch RoboTwin run
# and the LR is dropped to the real-world value (5e-5, per the interndata_a1 configs).

defaults:
  - override /data: ur3_flux2
  - override /model: imagewam_flux2_klein_4b_base
  - _self_

data:
  train:
    require_text_cache: false
    qwen_text_cache_dir: ???        # set by the run script (UR3_DATA_ROOT/flux2_qwen3_cache_4b)
    qwen_context_len: 512
    qwen_text_cache_format: qwen3_flux2
  val:
    require_text_cache: false
    qwen_text_cache_dir: ???
    qwen_context_len: 512
    qwen_text_cache_format: qwen3_flux2

batch_size: 12
num_workers: 24
prefetch_factor: 2
persistent_workers: true
keep_latest_state_only: true

lr_scheduler_type: "cosine"
learning_rate: 5e-5
num_epochs: 30
max_steps: null
log_every: 10
save_every: 2000
eval_every: 1000

gradient_accumulation_steps: 4
weight_decay: 1e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: true
  project: imagewam
  name: ur3_flux2_klein_4b_base_imagewam
