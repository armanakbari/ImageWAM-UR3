# @package _global_

# Real-world UR3 (blue_basket + mug, trained jointly) fine-tuning in the 16D space
# expected by the released InternData-A1 pretrain weight
# (yuyangalin/ImageWAM-FLUX.2-4B-InternData-A1-EE).
#
# Hyperparameters follow the upstream fine-tune-from-pretrain recipe
# (robotwin_flux2_klein_4b_base_clean_imagewam_ee16), i.e. the lower 2.5e-5 LR used
# when warm-starting from the pretrain rather than the 5e-5 used from base FLUX.2.
# save_every is tightened to 1000 because 200 real episodes overfit quickly and the
# best checkpoint has to be picked by real-robot success rate, not by the last step.
#
# `resume` is left null here; the launch script
# (scripts/flux2/run_finetune_flux2_klein_ur3_ee16.sh) sets it to PRETRAIN_CHECKPOINT,
# which loads weights only (fresh optimizer/step).

defaults:
  - override /data: ur3_basket_mug_ee16
  - override /model: imagewam_flux2_klein_4b_base
  - _self_

data:
  train:
    qwen_text_cache_format: qwen3_flux2
  val:
    qwen_text_cache_format: ${data.train.qwen_text_cache_format}

batch_size: 12
# Per rank, not global. Upstream's 24 assumes an 8-GPU box with more RAM headroom;
# ~12 already saturates a 4B FLUX.2 step at this sample cost.
num_workers: 12
prefetch_factor: 2
persistent_workers: true
keep_latest_state_only: true

lr_scheduler_type: "cosine"
learning_rate: 2.5e-5
num_epochs: 50
max_steps: null
log_every: 10
save_every: 1000
eval_every: 500
# Per rank. The default of 1 (=4 clips on 4 GPUs) makes infer_psnr/ssim/action_l1 pure
# noise, because trainer.evaluate() reseeds off global_step and so draws a different
# clip set every eval. 8 (=32 clips) matches the interndata config and gives a readable
# curve. Note: the 2026-08-12_15-20-35 run predates this and logged 4-clip evals.
eval_num_samples: 8

gradient_accumulation_steps: 4
weight_decay: 1e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}
  qwen_context_len: ${data.train.qwen_context_len}

wandb:
  enabled: true
  project: imagewam
  name: ur3_basket_mug_flux2_klein_4b_base_imagewam_ee16
